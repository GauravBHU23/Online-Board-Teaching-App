# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy with: New > Blueprint, point Render at this repo, then set
# BOARD_PASSWORD in the dashboard when prompted.
#
# NOTE: this is the FREE configuration. Free instances cannot mount a disk,
# so boards live only in the container's ephemeral filesystem and are lost on
# every restart, redeploy, or sleep. To make boards permanent, switch to
# `plan: starter` and add back the disk block shown at the bottom of this file.
services:
  - type: web
    name: online-board
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # The shared password. sync:false means Render prompts for it at deploy
      # time and keeps it out of this file (and out of git).
      - key: BOARD_PASSWORD
        sync: false

      # Signs session cookies. Generated once by Render; keeping it stable is
      # what lets logins survive a restart.
      - key: SESSION_SECRET
        generateValue: true

      # Writable path inside the container. This is NOT persistent on the free
      # plan — it is wiped whenever the instance restarts.
      - key: DATA_DIR
        value: /tmp/board-data

# ---------------------------------------------------------------------------
# To upgrade to persistent boards later:
#   1. change `plan: free` to `plan: starter`
#   2. change DATA_DIR's value to /var/data
#   3. uncomment the disk block below
#   4. commit, push — Render redeploys automatically
#
#    disk:
#      name: board-data
#      mountPath: /var/data
#      sizeGB: 1
# ---------------------------------------------------------------------------
